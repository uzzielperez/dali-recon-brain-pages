<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DALI Control Room</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--dim:#8b949e;
--ok:#3fb950;--warn:#d29922;--bad:#f85149;--accent:#58a6ff;--purple:#bc8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;
align-items:baseline;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .meta{color:var(--dim);font-size:12px}
nav{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--border);
flex-wrap:wrap;background:#10151c;position:sticky;top:0;z-index:5}
nav button{background:none;border:none;color:var(--dim);padding:10px 14px;
cursor:pointer;font-size:14px;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
main{padding:18px;max-width:1400px;margin:0 auto}
.tab{display:none}.tab.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px}
.card h3{margin:0 0 6px;font-size:15px}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.kv b{color:var(--fg);font-weight:600}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;
font-weight:600;vertical-align:middle}
.b-ok{background:#12261e;color:var(--ok)}.b-warn{background:#2b2008;color:var(--warn)}
.b-bad{background:#2d1214;color:var(--bad)}.b-info{background:#0f2038;color:var(--accent)}
.b-dim{background:#1c2128;color:var(--dim)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
code{background:#1c2128;padding:1px 5px;border-radius:4px;font-size:12px}
svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--border);border-radius:8px}
.edge-d{stroke:#3fb950;stroke-width:2}.edge-p{stroke:#d29922;stroke-width:2;stroke-dasharray:7 4}
.edge-a{stroke:#8b949e;stroke-width:1.6;stroke-dasharray:2 4}
.arrow{fill:#3fb950}.arrow-w{fill:#d29922}.arrow-a{fill:#8b949e}
.nodelbl{fill:#e6edf3;font:600 14px sans-serif}.nodesub{fill:#8b949e;font:11px sans-serif}
.edgelbl{fill:#c9d1d9;font:11px sans-serif}
.bar{height:9px;border-radius:5px;background:#21262d;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
a{text-decoration:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.wrap{overflow-x:auto}
h2{font-size:15px;margin:20px 0 8px;color:var(--accent)}
h2:first-child{margin-top:0}
.small{font-size:12px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#1c2128;border:1px solid var(--border);border-radius:6px;
padding:3px 9px;font-size:12px}
</style>
</head>

const LEGEND=()=>`<p class="small">${badge('solid green','ok')} demonstrated by a run &nbsp; ${badge('dashed amber','warn')} partial &nbsp; ${badge('dotted grey','dim')} architectural (not yet traversed by one event) &nbsp; ${badge('inferred','bad')} no citation — treat as a hypothesis</p>`;

function ledger(rows){
  if(!rows.length) return '';
  const body=rows.map(([a,b,desc,st,note])=>{
    const cls=st==='demonstrated'?'ok':st==='partial'?'warn':st==='inferred'?'bad':'dim';
    return `<tr><td><code>${esc(a)}</code> → <code>${esc(b)}</code></td><td>${esc(desc)}</td>

}

// Layered left-to-right layout. A node's column is its declared `layer`, else a
// longest-path depth computed from the edges, so a DAG draws without hand-tuning.
function layout(nodes, pipes){
  const names=nodes.map(n=>n.name);
  const declared={}; nodes.forEach(n=>{if(n.layer!=null)declared[n.name]=+n.layer;});
  const inc={}; names.forEach(n=>inc[n]=0);
  pipes.forEach(([a,b])=>{if(a in inc&&b in inc)inc[b]++;});
  const depth={}; names.forEach(n=>depth[n]=declared[n.name]??0);
  for(let it=0;it<names.length;it++){          // relax: depth[b] > depth[a]+1
    let moved=false;
    pipes.forEach(([a,b])=>{if(a in depth&&b in depth&&depth[b]<depth[a]+1){depth[b]=depth[a]+1;moved=true;}});
    if(!moved)break;
  }
  const layerOf=n=>declared[n.name]??depth[n];
  const byLayer={};
  names.forEach(n=>{(byLayer[layerOf(n)]=byLayer[layerOf(n)]||[]).push(n)});
  const layers=Object.keys(byLayer).map(Number).sort((x,y)=>x-y);
  const W=1100, rowH=110, H=Math.max(360, layers.length>1?360:(byLayer[layers[0]]||[]).length*rowH+120);
  const colGap=layers.length>1?(W-300)/(layers.length-1):0;
  const pos={};
  layers.forEach(L=>{const ns=byLayer[L];ns.forEach((n,i)=>{
    pos[n]={x:150+L*colGap, y:70+i*(H-140)/Math.max(1,ns.length-1)+(ns.length===1?(H-140)/2:0)};
  });});
  return {pos,W,H,layers};
}

function layoutFrom(pos){
  const xs=Object.values(pos).map(p=>p.x), ys=Object.values(pos).map(p=>p.y);
  return {W:Math.max(700,Math.max(...xs)+300), H:Math.max(320,Math.max(...ys)+90)};
}

function drawGraph(pipes, pos){
  const {W,H}=layoutFrom(pos);
  let svg=`<svg viewBox="0 0 ${W} ${H}">`;
  svg+=`<defs><marker id="mg" class="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0L7,3L0,6z"/></marker>
  <marker id="mw" class="arrow-w" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0L7,3L0,6z"/></marker>
  <marker id="ma" class="arrow-a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0L7,3L0,6z"/></marker></defs>`;
  pipes.forEach(([a,b,desc,st])=>{
    if(!(a in pos)||!(b in pos))return;
    const p1=pos[a],p2=pos[b];
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const cls=st==='demonstrated'?'edge-d':st==='partial'?'edge-p':'edge-a';
    const mk=st==='demonstrated'?'url(#mg)':st==='partial'?'url(#mw)':'url(#ma)';
    svg+=`<path class="${cls}" d="M${p1.x+95},${p1.y} C${mx},${p1.y} ${mx},${p2.y} ${p2.x-8},${p2.y}" marker-end="${mk}"/>`;
    const short=desc.length>46?desc.slice(0,44)+'…':desc;
    svg+=`<text class="edgelbl" x="${mx}" y="${my-8}" text-anchor="middle">${esc(short)}</text>`;
  });
  return svg;
}
function drawNodes(nodes, pos){
  let svg='';
  nodes.forEach(({name,note,link})=>{
    const p=pos[name]; if(!p)return;
    const br=(D.brains||{})[name];
    const sub=note||(br&&br.docs!=null?br.docs+' chunks':(br?'':'not a brain'));
    // a linked node gets an accent border and is a real anchor in the SVG
    const stroke=link?'#58a6ff':'#30363d';
    const g=`<g><rect x="${p.x-95}" y="${p.y-26}" width="190" height="52" rx="8" fill="#1c2128" stroke="${stroke}"/>
      <text class="nodelbl" x="${p.x}" y="${p.y-4}" text-anchor="middle">${esc(name)}</text>
      <text class="nodesub" x="${p.x}" y="${p.y+14}" text-anchor="middle">${esc(sub.length>34?sub.slice(0,32)+'…':sub)}</text></g>`;
    svg+=link?`<a href="${esc(link)}" target="_blank" rel="noopener" title="${esc(link)}">${g}</a>`:g;
  });
  return svg;
}

function renderGraphInto(sec, title, subtitle, nodes, pipes){
  const {pos}=layout(nodes,pipes);
  const svg=drawGraph(pipes,pos)+drawNodes(nodes,pos)+'</svg>';
  document.getElementById(sec).innerHTML=
    `<h2>${esc(title)}</h2>${subtitle?`<p class="small">${esc(subtitle)}</p>`:''}${svg}${LEGEND()}${ledger(pipes)}`;
}

      <polyline points="${pts}" fill="none" stroke="#58a6ff" stroke-width="2"/>
      ${tr.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.passed||0)}" r="4" fill="${h.ok?'#3fb950':'#f85149'}"><title>${esc(h.ts)} — ${h.passed}/${h.total}</title></circle>`).join('')}
      </svg><p class="small">gold-set pass count per graded run · ${tr.length} runs · n is small, treat as a trace not a trend</p>`;
  } else spark='<p class="small">need ≥2 graded runs for a trend</p>';

  // 2. the three objects and their metrics
  const cards=TARGETS.map(([k,what,metric])=>{
    const d=bt[k]||{n:0,kept:0};
    return `<div class="card"><h3>${esc(k)} ${d.n?badge(d.kept+'/'+d.n+' kept','info'):badge('no changes yet','dim')}</h3>
      <div class="kv"><span>what changes</span><b class="small">${esc(what)}</b></div>
      <div class="kv"><span>metric</span><b class="small">${esc(metric)}</b></div></div>`;}).join('');

  // 3. guard metrics — must not regress
  const guard=(n,v,tot,note)=>`<div class="card"><h3>${esc(n)}</h3>
      <div class="kv"><span>value</span><b>${v==null?'—':v}${tot!=null?' / '+tot:''}</b></div>
      <div class="kv"><span>rule</span><b class="small">${esc(note)}</b></div></div>`;
  const guards=guard('gold pass',g.gold_pass,g.gold_total,'must not fall when anything is tuned')
    +guard('negative controls',g.negative_controls,g.negative_controls_total,'must stay a MISS — a pass here means the tool is lying')
    +guard('runs logged',g.runs_logged,null,'≥20 before a regression claim means anything');

  // 4. the ledger, newest first
  const rows=[...ch].reverse().map(c=>`<tr>
      <td class="small">${esc((c.ts||'').slice(0,16).replace('T',' '))}</td>
      <td>${badge(c.target||'?',c.target==='brain'?'info':c.target==='agent'?'warn':'dim')}</td>
      <td>${esc(c.change||'')}</td>
      <td class="small">${esc(c.before||'—')} → <b>${esc(c.after||'—')}</b></td>
      <td>${c.keep===false||c.kept===false?badge('reverted','bad'):badge('kept','ok')}</td>
      <td class="small">${esc(c.reason||'')}${c.ref?'<br><code>'+esc(c.ref)+'</code>':''}</td></tr>`).join('');

  sec.innerHTML=`
    <h2>Is it working? ${g.gold_pass!=null?badge(g.gold_pass+'/'+g.gold_total+' gold',g.gold_pass===g.gold_total?'ok':'warn'):badge('no grade','dim')}
      ${ch.length?badge(ch.length+' changes logged','info'):''}</h2>
    <p class="small">Three objects improve at different rates and are measured separately — a failed gold item does
    not say <i>which</i> one is at fault, so every change declares its target. The agent's judgement (its
    markdown contract) is <b>not</b> a tunable: an unevidenced claim is not a parameter miss.</p>

    <h2>What the score is, and how it is measured</h2>
    <div class="wrap"><table>
      <tr><th>item</th><th>value</th><th>how it is produced</th></tr>
      <tr><td><b>Score</b></td><td>${g.gold_pass}/${g.gold_total}</td>
        <td class="small">count of gold items that PASS. An item is a natural-language query plus an
        expected <code>doc_path</code> regex. The query is embedded, the index returns ranked chunks, and the item
        passes when a chunk whose path matches the regex appears within the top-k. A miss, or a hit only below
        top-k, is a failure. Graded by <code>bench_evals.py</code>, which exits non-zero on any failure — the
        number is a gate, not a report.</td></tr>
      <tr><td><b>Where it comes from</b></td><td class="small">${esc(((D.evals||{}).gold||[]).length)} gold sets</td>
        <td class="small">hand-written from pipeline configs, READMEs and branch diffs — <b>not</b> generated from
        the corpus, so it cannot be inflated by adding documents. Frozen: the improver has no write access to it.</td></tr>
      <tr><td><b>Guard: negative controls</b></td><td>${g.negative_controls}/${g.negative_controls_total}</td>
        <td class="small">deliberately meaningless queries ("purple flamingo cross section…"). They must
        <b>miss</b>: if the top cosine similarity exceeds 0.45 the index is scoring confidently on nonsense and
        every other number on this page is untrustworthy. A pass here is a failure.</td></tr>
      <tr><td><b>Guard: runs logged</b></td><td>${g.runs_logged}</td>
        <td class="small">appended to <code>evals/runs.jsonl</code> per grading run. Below ~20 runs the trend line
        is a trace, not evidence of improvement — a single re-grade can move it several points.</td></tr>
      <tr><td><b>What is NOT in the score</b></td><td class="small">—</td>
        <td class="small">retrieval rank quality beyond the pass threshold, latency, token cost, and whether the
        agent's <i>conclusion</i> was right. A correct answer reached from a wrong citation scores full marks;
        that gap is why unevidenced claims are policed by rule, not by this metric.</td></tr>
    </table></div>
    <p class="small"><b>Kept-or-reverted rule:</b> a change is kept only if the score rises <i>and</i> no
    previously-passing item regresses <i>and</i> the negative controls still miss. Any one of those failing
    reverts the change.</p>
    <h2>Score over time</h2>${spark}
    <h2>What can change, and how it is measured</h2><div class="cards">${cards}</div>
    <h2>Guards — a change is kept only if these hold</h2><div class="cards">${guards}</div>
    <h2>Change ledger (append-only, newest first)</h2>
    <div class="wrap"><table><tr><th>when</th><th>target</th><th>change</th><th>before → after</th><th>verdict</th><th>why</th></tr>${rows}</table></div>
    <p class="small">Ledger: <code>evals/changes.jsonl</code> — append-only, and the gold sets are outside the
    improver's write path so a score cannot be bought by editing the test.</p>`;
}

/* ---------- COST & SCALE ---------- */
function renderCost(){
  const c=D.cost; const sec=document.getElementById('tab-cost');
  if(!c){sec.innerHTML='<p class="small">no <code>cost:</code> section in the config</p>';return;}
  const M=x=>(x/1e6).toLocaleString(undefined,{maximumFractionDigits:2});
  const K=x=>(x/1e3).toLocaleString(undefined,{maximumFractionDigits:1});
  const cpt=c.chars_per_token||4, T=c.total;
  const perQ=c.top_k*c.tokens_per_chunk+c.answer_tokens;

  const rows=Object.entries(c.per_brain).sort((a,b)=>b[1].chunks-a[1].chunks).map(([n,v])=>
    `<tr><td><b>${esc(n)}</b></td><td>${v.chunks.toLocaleString()}</td><td>${M(v.chars)}</td>
     <td>${M(v.chunks*(c.tokens_per_chunk||0))}</td><td>${v.index_mb}</td>
     <td>${mapLink(n)}</td></tr>`).join('');

  const usage=(c.queries_per_day||[]).map(q=>{
    const day=q*perQ, yr=day*365, embYr=(T.tokens_total||0)*(c.rebuilds_per_year||0);
    return `<tr><td>${q} queries/day</td><td>${K(day)}</td><td>${M(yr)}</td>
      <td>${M(embYr)}</td><td>${esc(c.top_k)} chunks ≈ ${c.top_k*(c.tokens_per_chunk||0)} tok in + ${c.answer_tokens} out</td></tr>`;}).join('');

  const inf=(c.inference||[]).map(i=>{
    const perEv=i.ms_per_event!=null?i.ms_per_event:(i.ms_per_batch!=null&&i.batch?i.ms_per_batch/i.batch:null);
    const cap=perEv?(1000/perEv):null;
    return `<tr><td><b>${esc(i.model)}</b><br><span class="small">${esc(i.device||'')}</span></td>
      <td>${i.ms_per_batch!=null?i.ms_per_batch+' ms / '+i.batch+'<br><span class="small">±'+(i.std_ms||'?')+' ms, n='+(i.n_samples||'?')+'</span>':'—'}</td>
      <td>${perEv!=null?perEv.toFixed(4)+' ms':'—'}</td>
      <td>${cap?Math.round(cap).toLocaleString()+' /s':'—'}</td>
      <td>${cap?M(cap*86400)+' M/day':'—'}</td>
      <td>${i.onnx_bytes?(i.onnx_bytes/1024).toFixed(0)+' KB':'—'}</td>
      <td class="small">${esc(i.source||'— no source —')}${i.caveat?'<br><i>'+esc(i.caveat)+'</i>':''}</td></tr>`;}).join('');

  const e=c.embedder||{};
  sec.innerHTML=`
   <h2>Corpus — measured from the indexes at build time</h2>
   <div class="cards">
     <div class="card"><h3>${T.chunks.toLocaleString()} chunks</h3><div class="kv"><span>stored text</span><b>${M(T.chars)} M chars</b></div>
       <div class="kv"><span>≈ tokens</span><b>${M(T.tokens_total||0)} M</b></div>
       <div class="kv"><span>at</span><b>${cpt} chars/token (estimate)</b></div>
       <div class="kv"><span>index on disk</span><b>${T.index_mb} MB</b></div></div>
     <div class="card"><h3>Embedding model</h3>
       <div class="kv"><span>name</span><b>${esc(e.name||'—')}</b></div>
       <div class="kv"><span>parameters</span><b>${e.params?(e.params/1e6).toFixed(1)+' M':'needs_review'}</b></div>
       <div class="kv"><span>dim</span><b>${e.dim||'—'}</b></div>
       <div class="kv"><span>role</span><b class="small">${esc(e.note||'')}</b></div>
       <div class="kv"><span>source</span><b class="small">${esc(e.source||'')}</b></div></div>
     <div class="card"><h3>Per query</h3>
       <div class="kv"><span>top_k</span><b>${c.top_k}</b></div>
       <div class="kv"><span>context</span><b>${c.top_k*(c.tokens_per_chunk||0)} tokens</b></div>
       <div class="kv"><span>answer</span><b>${c.answer_tokens} tokens</b></div>
       <div class="kv"><span>total</span><b>${perQ} tokens</b></div></div>
   </div>
   ${docLinks()}
   <h2>Per brain</h2><div class="wrap"><table><tr><th>brain</th><th>chunks</th><th>M chars</th><th>≈M tokens</th><th>index MB</th><th>map</th></tr>${rows}</table></div>
   <h2>LLM tokens per day / year</h2><div class="wrap"><table><tr><th>usage</th><th>tokens/day</th><th>tokens/yr</th><th>embed tokens/yr</th><th>per query</th></tr>${usage}</table></div>
   <h2>Plugged models — measured latency</h2><div class="wrap"><table><tr><th>model</th><th>batch latency</th><th>per event</th><th>events/s</th><th>capacity/day</th><th>artefact</th><th>source</th></tr>${inf}</table></div>
   <h2>Caveats</h2><ul class="small">${(c.notes||[]).map(n=>'<li>'+esc(n)+'</li>').join('')}</ul>`;
}

/* ---------- EVALS ---------- */
function renderEvals(){
  const ev=D.evals, L=ev.latest;
  let head='';
  if(L){
    const pct=Math.round(100*L.passed/L.total);
    head=`<div class="card"><div class="kv"><span>last run</span><b>${esc(L.ts)}</b></div>
    <div class="kv"><span>verdict</span><b>${L.ok?badge('OK','ok'):badge('FAIL','bad')}</b></div>
    <div class="kv"><span>passed</span><b>${L.passed}/${L.total} (${pct}%)</b></div>
    <div class="bar" style="margin-top:6px"><i style="width:${pct}%;background:${L.ok?'var(--ok)':'var(--bad)'}"></i></div></div>`;
  }
  const perSet={};
  ev.gold.forEach(s=>{perSet[s.id]={gold:s.items.length,db:(s.collection||''),status:s.status||'?',items:s.items}});
  if(L&&L.results)L.results.forEach(r=>{const p=perSet[r.set];if(p){p.last_rank=r.rank;p.last_pass=r.pass;p.latency=r.latency_s;}});
  const rows=Object.entries(perSet).map(([id,p])=>{
    const st=p.last_pass===undefined?badge('not in last run','dim'):p.last_pass?badge('pass','ok'):badge('FAIL','bad');
    return `<tr><td><b>${esc(id)}</b></td><td><code>${esc(p.db)}</code></td><td>${p.gold}</td>
    <td>${p.last_rank===undefined?'—':'rank '+p.last_rank}</td><td>${p.latency!==undefined?p.latency.toFixed(2)+'s':'—'}</td><td>${st}</td></tr>`;}).join('');
  const fails=(L&&L.results||[]).filter(r=>!r.pass).map(r=>
    `<tr><td>${esc(r.set)}</td><td>${esc(r.query)}</td><td>rank ${r.rank}</td><td>${r.needs_review?badge('needs_review','warn'):''}</td></tr>`).join('');
  // run history: sparkline of every bench_evals run in runs.jsonl
  const hist=ev.history||[];
  let histHtml='<p class="small">no runs recorded</p>';
  if(hist.length){
    const W=Math.max(360,hist.length*90),H=150,base=H-30;
    const y=v=>base-(v/Math.max(...hist.map(h=>h.total))*100);
    let pts=hist.map((h,i)=>`${40+i*90},${y(h.passed)}`).join(' ');
    let svg=`<svg viewBox="0 0 ${W} ${H}"><line x1="30" y1="${base}" x2="${W-10}" y2="${base}" stroke="#30363d"/>`;
    svg+=`<polyline fill="none" stroke="#58a6ff" stroke-width="2" points="${pts}"/>`;
    hist.forEach((h,i)=>{
      const cx=40+i*90;
      svg+=`<circle cx="${cx}" cy="${y(h.passed)}" r="5" fill="${h.ok?'#3fb950':'#f85149'}"/>`;
      svg+=`<text class="nodesub" x="${cx}" y="${y(h.passed)-10}" text-anchor="middle">${h.passed}/${h.total}</text>`;
      svg+=`<text class="nodesub" x="${cx}" y="${base+14}" text-anchor="middle">${esc(h.ts.slice(5,16).replace('T',' '))}</text>`;});
    histHtml=svg+'</svg>';
  }
  document.getElementById('tab-evals').innerHTML=
    `<h2>Latest bench_evals run</h2>${head}
     <h2>Run history (evals/runs.jsonl)</h2>${histHtml}
     <h2>Gold sets</h2><div class="wrap"><table><tr><th>set</th><th>index</th><th>items</th><th>last rank</th><th>latency</th><th>status</th></tr>${rows}</table></div>
     ${fails?`<h2>Failing items</h2><div class="wrap"><table><tr><th>set</th><th>query</th><th>rank</th><th></th></tr>${fails}</table></div>`:''}
     <p class="small">Run: <code>python3 evals/bench_evals.py</code> — verdict gates regressions; a failing item blocks the pipeline that consumes that index.</p>`;
}

/* ---------- SKILLS & TOOLS ---------- */
function renderSkills(){
  let out='<h2>Skills inventory</h2>';
  D.skills.forEach(([label,names])=>{
    out+=`<h3>${esc(label)} <span class="small">(${names.length})</span></h3><div class="chips">`+
      names.map(n=>`<span class="chip">${esc(n)}</span>`).join('')+`</div>`;});
  const rows=D.tools.map(([t,d])=>`<tr><td><code>${esc(t)}</code></td><td>${esc(d)}</td></tr>`).join('');
  out+=`<h2>Tools</h2><div class="wrap"><table><tr><th>tool</th><th>role</th></tr>${rows}</table></div>`;
  document.getElementById('tab-skills').innerHTML=out;
}

/* ---------- AGENT & WORKSPACE ---------- */
function renderAgent(){
  const d=D.dali;
  const steps=d.steps.map(s=>`<tr><td><code>${esc(s.id)}</code></td><td>${esc(s.desc)}</td><td>${s.checks}</td></tr>`).join('');
  const log=d.log.map(e=>`<tr><td class="mono">${esc(e.ts||e.date||'')}</td><td>${esc(e.step||e.action||'')}</td><td class="small">${esc(JSON.stringify(e.result||e.outcome||e.note||'').slice(0,160))}</td></tr>`).join('');
  const agents=[
    ['DALI orchestrator (this agent)','stage machine setup→index→claims→reconcile→build→run→report; membrane-gated; escalates after 3 fails'],
    ['explore subagent','read-only codebase search; used for repo archaeology'],
    ['general subagent','multi-unit work: parallel rebuilds, diagram drafts'],
    ['reviewer-referee / commenter skills','gate-based review of notes/drafts'],
    ['membrane','not an agent — the semipermeable boundary every data read crosses'],
  ].map(([a,r])=>`<tr><td><b>${esc(a)}</b></td><td>${esc(r)}</td></tr>`).join('');
  document.getElementById('tab-agent').innerHTML=
    `<h2>Pipeline steps (state/pipeline.yaml)</h2><div class="wrap"><table><tr><th>step</th><th>description</th><th>checks</th></tr>${steps||'<tr><td colspan=3 class="small">pipeline.yaml not parsed — see workspace</td></tr>'}</table></div>
     <h2>Agents & roles</h2><div class="wrap"><table><tr><th>actor</th><th>role</th></tr>${agents}</table></div>
     <h2>Recent workspace log (state/log.jsonl)</h2><div class="wrap"><table><tr><th>ts</th><th>step</th><th>result</th></tr>${log}</table></div>`;
}

renderPipes();renderGraphs();renderBrains();renderImprove();renderCost();renderCommits();renderEvals();renderSkills();renderAgent();
const want=(location.hash||'').slice(1);
show(TABS.some(([id])=>id===want)?want:'pipes');
</script>
